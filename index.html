<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Chamada Escolar</title>
  <!-- Tailwind CSS para estilização -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome para ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

  <!-- CABEÇALHO -->
  <header class="bg-blue-700 text-white shadow-md p-4 mb-6">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <i class="fa-solid fa-clipboard-user"></i> Diário de Classe Digital
      </h1>
      <span class="text-xs bg-blue-800 px-3 py-1 rounded-full border border-blue-600">GitHub Pages</span>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="max-w-5xl mx-auto px-4 pb-12">
    
    <!-- PAINEL DE FILTROS E SELEÇÃO -->
    <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 mb-6">
      <h2 class="text-lg font-semibold text-slate-700 mb-4 flex items-center gap-2">
        <i class="fa-solid fa-filter text-blue-600"></i> Seleção de Turma e Data
      </h2>
      
      <div class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-5 gap-4">
        <!-- Unidade -->
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Unidade</label>
          <select id="selectUnidade" onchange="filtrarTurmas()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="Sede">Sede</option>
            <option value="Morada Nova">Morada Nova</option>
          </select>
        </div>

        <!-- Turno -->
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Turno</label>
          <select id="selectTurno" onchange="filtrarTurmas()" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="Manhã">Manhã</option>
            <option value="Tarde">Tarde</option>
            <option value="Noite">Noite</option>
          </select>
        </div>

        <!-- Turma -->
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Turma</label>
          <select id="selectTurma" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="">Carregando turmas...</option>
          </select>
        </div>

        <!-- Mês -->
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Mês</label>
          <select id="selectMes" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <option value="JANEIRO">Janeiro</option>
            <option value="FEVEREIRO">Fevereiro</option>
            <option value="MARÇO">Março</option>
            <option value="ABRIL">Abril</option>
            <option value="MAIO">Maio</option>
            <option value="JUNHO">Junho</option>
            <option value="JULHO">Julho</option>
            <option value="AGOSTO">Agosto</option>
            <option value="SETEMBRO">Setembro</option>
            <option value="OUTUBRO">Outubro</option>
            <option value="NOVEMBRO">Novembro</option>
            <option value="DEZEMBRO">Dezembro</option>
          </select>
        </div>

        <!-- Data -->
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Data</label>
          <input type="date" id="inputData" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <!-- Botão Buscar -->
      <div class="mt-5 text-right">
        <button onclick="carregarChamada()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-medium text-sm transition flex items-center gap-2 justify-center w-full md:w-auto ml-auto">
          <i class="fa-solid fa-magnifying-glass"></i> Carregar Chamada
        </button>
      </div>
    </div>

    <!-- MENSAGEM DE STATUS / CARREGANDO -->
    <div id="statusMessage" class="hidden p-4 rounded-xl text-center text-sm font-medium mb-6"></div>

    <!-- LISTA DE CHAMADA -->
    <div id="areaChamada" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <div class="p-4 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
        <div>
          <h3 id="tituloTurma" class="font-bold text-slate-800 text-base">--</h3>
          <p id="subtituloChamada" class="text-xs text-slate-500">Alunos cadastrados na turma</p>
        </div>
        <div class="flex gap-2">
          <button onclick="marcarTodos('•')" class="bg-emerald-100 text-emerald-700 text-xs px-3 py-1.5 rounded-md font-semibold hover:bg-emerald-200">
            Todos Presentes (•)
          </button>
          <button onclick="marcarTodos('F')" class="bg-rose-100 text-rose-700 text-xs px-3 py-1.5 rounded-md font-semibold hover:bg-rose-200">
            Todos Faltas (F)
          </button>
        </div>
      </div>

      <!-- Tabela de Alunos -->
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="border-b border-slate-200 bg-slate-100/50 text-slate-600 text-xs uppercase">
              <th class="p-3 w-16">SIMADE</th>
              <th class="p-3">Nome do Estudante</th>
              <th class="p-3 text-center w-28">Faltas no Mês</th>
              <th class="p-3 text-center w-48">Presença / Falta</th>
            </tr>
          </thead>
          <tbody id="tbAlunos" class="divide-y divide-slate-100">
            <!-- Linhas inseridas dinamicamente via JS -->
          </tbody>
        </table>
      </div>

      <!-- Rodapé com Botão Salvar -->
      <div class="p-4 bg-slate-50 border-t border-slate-200 text-right">
        <button onclick="salvarChamada()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-8 py-3 rounded-lg font-bold text-sm transition shadow-sm flex items-center gap-2 justify-center w-full md:w-auto ml-auto">
          <i class="fa-solid fa-floppy-disk"></i> Salvar Registro de Chamada
        </button>
      </div>
    </div>

  </main>

  <!-- JAVASCRIPT & ADAPTADOR PARA GITHUB PAGES -->
  <script>
    // =========================================================================
    // PONTE DE ADAPTAÇÃO HÍBRIDA PARA DEPLOY NO GITHUB PAGES
    // =========================================================================
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxNYn4JNw21S0bWCzR87UTvg3Go2y_UNDrd02YB7By2Mx9D3rXNN8wIiyCxKZca42Bh0w/exec";

    if (typeof google === 'undefined') { window.google = {}; }
    if (!google.script) { google.script = {}; }

    if (!google.script.run) {
      function criarGasRunner() {
        let successCb = () => {};
        let failureCb = () => {};

        const runner = {
          withSuccessHandler(fn) {
            successCb = fn;
            return runner;
          },
          withFailureHandler(fn) {
            failureCb = fn;
            return runner;
          }
        };

        return new Proxy(runner, {
          get(target, prop) {
            if (prop in target) { return target[prop]; }
            return function(...args) {
              const url = GAS_WEB_APP_URL + '?action=' + encodeURIComponent(prop) + '&args=' + encodeURIComponent(JSON.stringify(args));
              fetch(url, {
                method: 'GET'
              })
              .then(res => res.json())
              .then(data => {
                if (data.status === 'error') {
                  failureCb(new Error(data.message));
                } else {
                  successCb(data.result);
                }
              })
              .catch(err => failureCb(err));
            };
          }
        });
      }

      Object.defineProperty(google.script, 'run', {
        get: function() { return criarGasRunner(); }
      });
    }
    // =========================================================================

    // VARIAVEIS DE ESTADO DA APLICAÇÃO
    let todasturmas = [];
    let alunosCarregados = [];

    // INICIALIZAÇÃO
    window.addEventListener('DOMContentLoaded', () => {
      // Definir data de hoje no input
      const hoje = new Date().toISOString().split('T')[0];
      document.getElementById('inputData').value = hoje;
      
      // Ajustar mês selecionado
      const meses = ["JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];
      const mesAtualIndex = new Date().getMonth();
      document.getElementById('selectMes').value = meses[mesAtualIndex];

      // Buscar turmas via backend
      exibirStatus("Carregando lista de turmas...", "bg-blue-50 text-blue-700 border border-blue-200");
      google.script.run
        .withSuccessHandler(res => {
          todasturmas = res;
          ocultarStatus();
          filtrarTurmas();
        })
        .withFailureHandler(err => {
          exibirStatus("Erro ao carregar turmas: " + err.message, "bg-rose-50 text-rose-700 border border-rose-200");
        })
        .getTurmasDisponiveis();
    });

    // FILTRA AS TURMAS DE ACORDO COM UNIDADE E TURNO SELECIONADOS
    function filtrarTurmas() {
      const unidade = document.getElementById('selectUnidade').value;
      const turno = document.getElementById('selectTurno').value;
      const selectTurma = document.getElementById('selectTurma');

      selectTurma.innerHTML = '';

      const filtradas = todasturmas.filter(t => t.unidade === unidade && t.turno === turno);

      if (filtradas.length === 0) {
        selectTurma.innerHTML = '<option value="">Nenhuma turma encontrada</option>';
        return;
      }

      filtradas.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = t.nome;
        selectTurma.appendChild(opt);
      });
    }

    // CARREGA OS ALUNOS DA TURMA
    function carregarChamada() {
      const turmaId = document.getElementById('selectTurma').value;
      const mes = document.getElementById('selectMes').value;
      const dataRaw = document.getElementById('inputData').value;

      if (!turmaId) {
        alert("Por favor, selecione uma turma válida.");
        return;
      }

      if (!dataRaw) {
        alert("Por favor, escolha uma data.");
        return;
      }

      // Formatar AAAA-MM-DD para DD/MM
      const partesData = dataRaw.split('-');
      const dataFormatada = `${partesData[2]}/${partesData[1]}`;

      exibirStatus("Carregando dados dos estudantes...", "bg-blue-50 text-blue-700 border border-blue-200");
      document.getElementById('areaChamada').classList.add('hidden');

      google.script.run
        .withSuccessHandler(res => {
          ocultarStatus();
          renderizarListaChamada(res, turmaId, dataFormatada);
        })
        .withFailureHandler(err => {
          exibirStatus("Erro ao carregar chamada: " + err.message, "bg-rose-50 text-rose-700 border border-rose-200");
        })
        .getDadosChamada(turmaId, mes, dataFormatada);
    }

    // RENDERIZA A TABELA DE ALUNOS
    function renderizarListaChamada(dados, turmaId, dataFormatada) {
      const turmaObj = todasturmas.find(t => t.id === turmaId);
      document.getElementById('tituloTurma').textContent = `${turmaObj ? turmaObj.nome : 'Turma'} - Data: ${dataFormatada}`;
      document.getElementById('subtituloChamada').textContent = `Total de ${dados.alunos.length} alunos cadastrados`;

      const tbody = document.getElementById('tbAlunos');
      tbody.innerHTML = '';

      alunosCarregados = dados.alunos;

      if (alunosCarregados.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-400">Nenhum aluno encontrado na aba ALUNOS desta turma.</td></tr>`;
      } else {
        alunosCarregados.forEach((aluno, index) => {
          const tr = document.createElement('tr');
          if (aluno.inativo) {
            tr.className = "bg-slate-50 text-slate-400 line-through";
          } else {
            tr.className = "hover:bg-slate-50/80 transition";
          }

          // Definir o estado inicial do status (Presença • como padrão se não preenchido)
          let statusAtual = '•';

          tr.innerHTML = `
            <td class="p-3 text-slate-500 font-mono text-xs">${aluno.simade || '-'}</td>
            <td class="p-3 font-medium ${aluno.inativo ? 'line-through text-slate-400' : 'text-slate-800'}">${aluno.nome}</td>
            <td class="p-3 text-center text-slate-600 font-semibold">${aluno.faltas || 0}</td>
            <td class="p-3 text-center">
              ${aluno.inativo ? '<span class="text-xs italic text-slate-400">Inativo</span>' : `
                <div class="inline-flex rounded-lg p-1 bg-slate-100 border border-slate-200" id="btnGroup_${index}">
                  <button type="button" onclick="alterarStatusAluno(${index}, '•')" id="btnP_${index}" class="px-3 py-1 rounded-md text-xs font-bold transition bg-emerald-600 text-white shadow-sm">
                    P (•)
                  </button>
                  <button type="button" onclick="alterarStatusAluno(${index}, 'F')" id="btnF_${index}" class="px-3 py-1 rounded-md text-xs font-bold transition text-slate-500 hover:text-slate-700">
                    F
                  </button>
                </div>
              `}
            </td>
          `;
          tbody.appendChild(tr);
          
          // Guarda o status no objeto do aluno
          aluno.status = statusAtual;
        });
      }

      document.getElementById('areaChamada').classList.remove('hidden');
    }

    // MUTA O STATUS DO ALUNO ENTRE PRESENÇA (•) E FALTA (F)
    function alterarStatusAluno(index, status) {
      alunosCarregados[index].status = status;
      const btnP = document.getElementById(`btnP_${index}`);
      const btnF = document.getElementById(`btnF_${index}`);

      if (status === '•') {
        btnP.className = "px-3 py-1 rounded-md text-xs font-bold transition bg-emerald-600 text-white shadow-sm";
        btnF.className = "px-3 py-1 rounded-md text-xs font-bold transition text-slate-500 hover:text-slate-700";
      } else {
        btnP.className = "px-3 py-1 rounded-md text-xs font-bold transition text-slate-500 hover:text-slate-700";
        btnF.className = "px-3 py-1 rounded-md text-xs font-bold transition bg-rose-600 text-white shadow-sm";
      }
    }

    // MARCAR TODOS COMO PRESENTE OU FALTA
    function marcarTodos(status) {
      alunosCarregados.forEach((aluno, index) => {
        if (!aluno.inativo) {
          alterarStatusAluno(index, status);
        }
      });
    }

    // SALVA A CHAMADA NO GOOGLE SHEETS
    function salvarChamada() {
      const turmaId = document.getElementById('selectTurma').value;
      const mes = document.getElementById('selectMes').value;
      const dataRaw = document.getElementById('inputData').value;

      const partesData = dataRaw.split('-');
      const dataFormatada = `${partesData[2]}/${partesData[1]}`;

      const presencas = alunosCarregados.map(a => ({
        nome: a.nome,
        status: a.status || '•',
        inativo: a.inativo
      }));

      exibirStatus("Salvando registro de chamada no Google Sheets...", "bg-blue-50 text-blue-700 border border-blue-200");

      google.script.run
        .withSuccessHandler(res => {
          exibirStatus("✅ " + res, "bg-emerald-50 text-emerald-700 border border-emerald-200");
          setTimeout(ocultarStatus, 4000);
        })
        .withFailureHandler(err => {
          exibirStatus("❌ Erro ao salvar chamada: " + err.message, "bg-rose-50 text-rose-700 border border-rose-200");
        })
        .salvarRegistroChamada(turmaId, mes, dataFormatada, presencas);
    }

    // UTILITÁRIOS DE EXIBIÇÃO DE MENSAGENS
    function exibirStatus(texto, classes) {
      const el = document.getElementById('statusMessage');
      el.className = `p-4 rounded-xl text-center text-sm font-medium mb-6 ${classes}`;
      el.textContent = texto;
      el.classList.remove('hidden');
    }

    function ocultarStatus() {
      document.getElementById('statusMessage').classList.add('hidden');
    }
  </script>
</body>
</html>
