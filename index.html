<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Diário de Classe Digital</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    /* ==========================================================================
       VARIÁVEIS GERAIS
       ========================================================================== */
    :root {
      --bg-color: #f1f5f9; 
      --card-bg: #ffffff;
      --primary-text: #0f172a; 
      --secondary-text: #64748b;
      --accent-color: #0f172a; 
      --link-color: #2563eb; 
      --brand-color: #8b5cf6;
      --brand-hover: #7c3aed;
      --brand-light: #f5f3ff;
      --danger-color: #ef4444; 
      --danger-light: #fef2f2;
      --success-color: #10b981; 
      --success-light: #ecfdf5;
      --row-even: #f8fafc; 
      --border-color: #e2e8f0;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.08);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }
    
    /* ==========================================================================
       ESTILOS BASE
       ========================================================================== */
    body { 
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif; 
      background-color: var(--bg-color); 
      margin: 0; 
      padding: 24px 16px; 
      color: var(--primary-text); 
      line-height: 1.5;
    }
    
    .card { 
      max-width: 960px; 
      margin: 0 auto; 
    }
    
    .tela-branca { 
      background: var(--card-bg); 
      border-radius: var(--radius-lg); 
      padding: 32px 28px; 
      box-shadow: var(--shadow-md); 
      border: 1px solid rgba(226, 232, 240, 0.8);
      margin-bottom: 24px;
    }
    
    /* ==========================================================================
       TELA DE LOGIN & NAVEGAÇÃO
       ========================================================================== */
    #tela-login { 
      max-width: 420px; 
      margin: 40px auto; 
      text-align: center; 
      padding: 48px 32px; 
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    
    .logo-escola { 
      width: 100%; 
      height: 90px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      margin: 0 auto 20px; 
    }
    .logo-escola img { height: 100%; object-fit: contain; }
    
    #tela-login h1 { 
      margin-top: 0; 
      font-size: 26px; 
      font-weight: 700; 
      color: var(--accent-color); 
      margin-bottom: 6px; 
      letter-spacing: -0.5px; 
    }
    
    #tela-login p { 
      color: var(--secondary-text); 
      font-size: 15px; 
      margin-bottom: 32px; 
    }
    
    .profile-tabs { 
      display: flex; 
      background: #f8fafc; 
      border-radius: var(--radius-md); 
      padding: 6px; 
      margin-bottom: 32px; 
      gap: 6px; 
      border: 1px solid var(--border-color);
    }
    .profile-tab { 
      flex: 1; 
      padding: 12px 8px; 
      text-align: center; 
      font-size: 14px; 
      font-weight: 600; 
      color: var(--secondary-text); 
      cursor: pointer; 
      border-radius: var(--radius-sm); 
      transition: all 0.2s ease; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
    }
    .profile-tab:hover { color: var(--primary-text); background: rgba(255, 255, 255, 0.6); }
    .profile-tab.selected { 
      background: var(--brand-color); 
      color: white; 
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3); 
    }

    .modo-nav { 
      display: flex; 
      background: #f8fafc; 
      border-radius: var(--radius-md); 
      padding: 6px; 
      margin-bottom: 28px; 
      border: 1px solid var(--border-color); 
      gap: 6px; 
    }
    .modo-btn { 
      flex: 1; 
      padding: 14px 10px; 
      text-align: center; 
      font-weight: 600; 
      font-size: 13px; 
      color: var(--secondary-text); 
      cursor: pointer; 
      border-radius: var(--radius-sm); 
      transition: all 0.2s ease; 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
      border: none; 
      background: transparent; 
    }
    .modo-btn:hover { color: var(--primary-text); }
    .modo-btn.selected { 
      background: var(--accent-color); 
      color: white; 
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2); 
    }
    
    #login-actions-dynamic { animation: slideUpFade 0.4s ease forwards; }
    @keyframes slideUpFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .login-input-group { text-align: left; margin-bottom: 24px; }
    .login-input-group label, .selection-label { 
      display: block; 
      font-size: 12px; 
      font-weight: 600; 
      color: var(--secondary-text); 
      text-transform: uppercase; 
      margin-bottom: 10px; 
      letter-spacing: 0.6px;
    }
    
    /* ==========================================================================
       INPUTS & BOTÕES GERAIS
       ========================================================================== */
    .login-input-group input, input[type="date"], input[type="text"], select { 
      width: 100%; 
      box-sizing: border-box; 
      font-size: 15px; 
      padding: 15px 18px; 
      border: 2px solid var(--border-color); 
      background: white; 
      transition: all 0.2s ease; 
      border-radius: var(--radius-sm); 
      outline: none; 
      color: var(--primary-text);
      font-weight: 500;
      margin-bottom: 0;
    }
    .login-input-group input:focus, input[type="date"]:focus, input[type="text"]:focus, select:focus { 
      border-color: var(--brand-color); 
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.12); 
    }

    .btn-brand, .btn-principal { 
      background: var(--brand-color); 
      color: white; 
      border-radius: var(--radius-sm); 
      width: 100%; 
      padding: 16px 24px; 
      font-weight: 600; 
      border: none; 
      cursor: pointer; 
      font-size: 14px; 
      transition: all 0.2s ease; 
      box-shadow: 0 4px 14px rgba(139, 92, 246, 0.28); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 8px; 
      text-transform: uppercase; 
      letter-spacing: 0.6px;
    }
    .btn-brand:hover, .btn-principal:hover { 
      background: var(--brand-hover); 
      transform: translateY(-2px); 
      box-shadow: 0 6px 18px rgba(139, 92, 246, 0.38); 
    }
    .btn-principal:disabled { 
      background-color: #cbd5e1; 
      color: #94a3b8;
      cursor: not-allowed; 
      box-shadow: none; 
      transform: none; 
    }
    .btn-secondary { 
      background-color: white; 
      color: var(--accent-color); 
      border: 2px solid var(--border-color); 
      box-shadow: var(--shadow-sm); 
      padding: 12px 20px; 
      margin-top: 0; 
      width: auto; 
      font-size: 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }
    .btn-secondary:hover { 
      border-color: var(--accent-color); 
      background-color: #f8fafc; 
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    /* ==========================================================================
       PAINEL E ELEMENTOS VISUAIS
       ========================================================================== */
    .header-painel { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 24px; 
      background: var(--card-bg); 
      padding: 20px 28px; 
      border-radius: var(--radius-lg); 
      box-shadow: var(--shadow-md); 
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    .header-painel h2 { 
      margin: 0; 
      font-size: 22px; 
      font-weight: 700; 
      color: var(--accent-color);
      letter-spacing: -0.5px;
    }
    .tag-perfil { 
      font-size: 11px; 
      background: var(--brand-color); 
      color: white; 
      padding: 5px 12px; 
      border-radius: 20px; 
      vertical-align: middle; 
      margin-left: 10px; 
      font-weight: 600; 
      letter-spacing: 0.8px; 
      text-transform: uppercase;
      box-shadow: 0 2px 8px rgba(139, 92, 246, 0.25);
    }

    .selection-group { margin-bottom: 28px; }
    .btn-grid { display: flex; flex-wrap: wrap; gap: 12px; }
    
    .btn-choice { 
      flex: 1 1 calc(33.333% - 12px); 
      min-width: 130px; 
      background: white; 
      border: 2px solid var(--border-color); 
      box-shadow: var(--shadow-sm); 
      border-radius: var(--radius-sm); 
      padding: 14px 12px; 
      font-size: 13px; 
      font-weight: 600; 
      color: var(--secondary-text); 
      cursor: pointer; 
      transition: all 0.2s ease; 
      text-align: center; 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
    }
    .btn-choice:hover { 
      border-color: var(--brand-color); 
      color: var(--brand-color);
      transform: translateY(-2px); 
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.12);
    }
    .btn-choice.selected {
      border-color: var(--brand-color);
      background-color: var(--brand-light);
      color: var(--brand-color);
    }

    /* CARDS DE TURMAS */
    .grid-turmas {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .card-turma {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 20px;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
      position: relative;
    }
    .card-turma:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-md);
      border-color: var(--brand-color);
    }
    .tag-turma {
      font-size: 10px;
      background: #f1f5f9;
      color: var(--secondary-text);
      padding: 4px 8px;
      border-radius: 8px;
      display: inline-block;
      margin-bottom: 8px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .titulo-turma { font-size: 18px; font-weight: 700; color: var(--accent-color); margin-bottom: 4px; }
    .info-turma { font-size: 12px; color: var(--secondary-text); }
    .status-container-card { margin-top: 12px; }
    
    .badge-sucesso-card { background: var(--success-light); color: var(--success-color); padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; display: inline-block; }
    .badge-alerta-card { background: #fffbeb; color: #d97706; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; display: inline-block; }
    .badge-loading-card { background: #f1f5f9; color: #64748b; padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; display: inline-block; }

    /* LISTA DE ESTUDANTES / CHAMADA */
    .lista-alunos-chamada { list-style: none; padding: 0; margin: 0; }
    .row-item {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      background: white;
    }
    .row-item:nth-child(even) { background: var(--row-even); }
    .row-item:last-child { border-bottom: none; }
    .simade { font-size: 12px; color: var(--secondary-text); width: 100px; flex-shrink: 0; }
    .student-name { flex-grow: 1; font-weight: 600; color: var(--primary-text); font-size: 14px; }
    .total-faltas { width: 60px; text-align: center; font-size: 13px; font-weight: bold; color: var(--secondary-text); flex-shrink: 0; }
    
    .btn-attendance {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .btn-attendance.presente { background: var(--success-light); color: var(--success-color); }
    .btn-attendance.falta { background: var(--danger-light); color: var(--danger-color); }
    
    /* TABELA MATRIZ */
    .matriz-container {
      overflow-x: auto;
      margin-top: 16px;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
    }
    .tabela-matriz { width: 100%; border-collapse: collapse; background: white; min-width: 600px; }
    .tabela-matriz th { background: #f8fafc; padding: 12px; text-align: center; font-size: 12px; color: var(--secondary-text); border-bottom: 2px solid var(--border-color); }
    .tabela-matriz td { padding: 10px; text-align: center; border-bottom: 1px solid var(--border-color); font-size: 13px; }
    
    /* LOADING OVERLAY */
    #loading-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255,255,255,0.8); display: none;
      align-items: center; justify-content: center; z-index: 9999;
      flex-direction: column; font-weight: bold; color: var(--brand-color);
    }
    .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--brand-color); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 16px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* ==========================================================================
       MEDIA QUERIES - RESPONSIVIDADE PARA CELULARES
       ========================================================================== */
    @media (max-width: 600px) {
      body { padding: 12px 8px; }
      .tela-branca { padding: 20px 16px; border-radius: var(--radius-md); }
      
      .header-painel { 
        flex-direction: column; 
        align-items: stretch; 
        gap: 16px; 
        padding: 16px; 
        text-align: center;
      }
      .header-painel h2 { font-size: 18px; }
      .tag-perfil { display: inline-block; margin-top: 4px; margin-left: 0; }
      
      .btn-secondary { width: 100%; justify-content: center; padding: 14px; font-size: 14px; }
      .btn-principal { padding: 16px; font-size: 14px; }
      
      .grid-turmas { grid-template-columns: 1fr; gap: 12px; }
      .card-turma { padding: 16px; }
      
      .row-item { flex-wrap: wrap; padding: 12px; gap: 8px; }
      .simade { font-size: 11px; width: 100%; text-align: left; margin-bottom: -4px; }
      .student-name { font-size: 14px; flex-basis: 60%; line-height: 1.2; }
      .total-faltas { font-size: 14px; width: 40px; }
      .btn-attendance { width: 48px; height: 48px; }
      
      .modo-nav { flex-direction: column; }
      .modo-btn { padding: 14px; font-size: 13px; }
      
      .tabela-matriz th, .tabela-matriz td { padding: 8px 6px; font-size: 11px; }
      .matriz-container { margin-top: 12px; border-radius: 8px; }
      
      .selection-group { margin-bottom: 16px; }
      
      .login-input-group input, input[type="date"], select { padding: 14px; font-size: 16px; } /* Prevents iOS zoom */
    }
  </style>
</head>
<body>

  <!-- LOADING OVERLAY -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div>Processando...</div>
  </div>

  <div class="card">
    
    <!-- TELA DE LOGIN -->
    <div id="tela-login" class="tela-branca">
      <div class="logo-escola">
        <h1 style="color: var(--brand-color); font-size: 28px;">Diário de Classe</h1>
      </div>
      <p>Selecione seu perfil de acesso</p>
      
      <div class="profile-tabs">
        <div class="profile-tab" onclick="selecionarPerfil('Professor')">Professor</div>
        <div class="profile-tab" onclick="selecionarPerfil('Secretaria')">Secretaria</div>
        <div class="profile-tab" onclick="selecionarPerfil('Supervisao')">Supervisão</div>
      </div>
    </div>

    <!-- TELA PAINEL PRINCIPAL -->
    <div id="tela-painel" style="display: none;">
      
      <div class="header-painel">
        <div>
          <h2>Painel Principal <span id="perfil-display" class="tag-perfil"></span></h2>
        </div>
        <button class="btn-secondary" onclick="fazerLogout()">Sair</button>
      </div>

      <div class="tela-branca">
        <div class="modo-nav">
          <button id="modo-diario-btn" class="modo-btn selected" onclick="alternarModo(this, 'diario')">Diário de Chamada</button>
          <button id="modo-relatorio-btn" class="modo-btn" onclick="alternarModo(this, 'relatorio')">Relatório Geral</button>
        </div>

        <div id="bloco-data" class="selection-group">
          <label class="selection-label">Data da Chamada</label>
          <input type="date" id="input-data" onchange="carregarCards()">
        </div>

        <div id="bloco-mes" class="selection-group" style="display: none;">
          <label class="selection-label">Mês de Referência</label>
          <select id="select-mes" onchange="carregarCards()">
            <option value="FEVEREIRO">FEVEREIRO</option>
            <option value="MARÇO">MARÇO</option>
            <option value="ABRIL">ABRIL</option>
            <option value="MAIO">MAIO</option>
            <option value="JUNHO">JUNHO</option>
            <option value="JULHO">JULHO</option>
            <option value="AGOSTO">AGOSTO</option>
            <option value="SETEMBRO">SETEMBRO</option>
            <option value="OUTUBRO">OUTUBRO</option>
            <option value="NOVEMBRO">NOVEMBRO</option>
            <option value="DEZEMBRO">DEZEMBRO</option>
          </select>
        </div>

        <div id="bloco-turmas" class="selection-group">
          <label class="selection-label">Selecione a Turma</label>
          <div id="grid-turmas" class="grid-turmas"></div>
        </div>
      </div>
    </div>

    <!-- TELA DE CHAMADA -->
    <div id="tela-chamada" style="display: none;">
      <div class="header-painel">
        <div>
          <h2>Realizar Chamada</h2>
          <p id="info-chamada" style="color: var(--secondary-text); margin: 4px 0 0; font-size: 14px;"></p>
        </div>
        <button class="btn-secondary" onclick="voltarParaPainel()">Voltar</button>
      </div>
      
      <div class="tela-branca">
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
          <button class="btn-secondary" onclick="marcarTodos('•')" style="flex: 1;">Todos Presentes</button>
          <button class="btn-secondary" onclick="marcarTodos('F')" style="flex: 1; color: var(--danger-color);">Todos Faltaram</button>
        </div>
        
        <div class="row-item" style="background: var(--brand-light); border-radius: 8px 8px 0 0; border-bottom: 2px solid var(--brand-color);">
          <div class="simade" style="font-weight:bold;">SIMADE</div>
          <div class="student-name" style="font-weight:bold;">NOME DO ESTUDANTE</div>
          <div class="total-faltas" style="font-weight:bold;">FALTAS</div>
          <div style="width: 44px; text-align: center; font-weight:bold; font-size: 12px; color:var(--secondary-text);">AÇÃO</div>
        </div>
        
        <ul id="lista-alunos" class="lista-alunos-chamada"></ul>
        
        <button class="btn-principal" onclick="salvarChamada()" style="margin-top: 24px;">Salvar Chamada</button>
      </div>
    </div>

    <!-- TELA RELATÓRIO GERAL -->
    <div id="tela-relatorio" style="display: none;">
      <div class="header-painel">
        <div>
          <h2>Relatório Geral</h2>
          <p id="info-relatorio" style="color: var(--secondary-text); margin: 4px 0 0; font-size: 14px;"></p>
        </div>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
          <button class="btn-secondary" onclick="exportarPDF()">Exportar PDF</button>
          <button class="btn-secondary" onclick="voltarParaPainel()">Voltar</button>
        </div>
      </div>

      <div class="tela-branca" style="padding: 16px;">
        <div class="matriz-container">
          <table class="tabela-matriz" id="tabela-relatorio">
            <thead id="matriz-thead"></thead>
            <tbody id="matriz-tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ==========================================================================
    // ESTADO E VARIÁVEIS GLOBAIS
    // ==========================================================================
    let state = {
      perfil: '',
      modo: 'diario',
      turmaId: '',
      turmaNome: '',
      // Alteração 1: Turno e Unidade fixos internamente
      turno: 'Manhã',
      unidade: 'Sede'
    };
    
    let dbTurmas = [];
    let dadosAlunosChamada = [];
    let alteracoesNaoSalvas = false;
    
    const MESES = ["JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO", "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"];

    // ==========================================================================
    // INICIALIZAÇÃO
    // ==========================================================================
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById('input-data').valueAsDate = new Date();
      document.getElementById('select-mes').value = MESES[new Date().getMonth()] || "FEVEREIRO";
      
      google.script.run.withSuccessHandler(turmas => {
        dbTurmas = turmas;
      }).getTurmasDisponiveis();
    });

    // ==========================================================================
    // NAVEGAÇÃO E PERFIS
    // ==========================================================================
    function selecionarPerfil(perfil) {
      state.perfil = perfil;
      document.getElementById('perfil-display').innerText = perfil;
      document.getElementById('tela-login').style.display = 'none';
      document.getElementById('tela-painel').style.display = 'block';
      carregarCards();
    }

    function fazerLogout() {
      if (alteracoesNaoSalvas && !confirm("Existem alterações não salvas. Deseja sair?")) return;
      state.perfil = '';
      document.getElementById('tela-painel').style.display = 'none';
      document.getElementById('tela-chamada').style.display = 'none';
      document.getElementById('tela-relatorio').style.display = 'none';
      document.getElementById('tela-login').style.display = 'block';
      alteracoesNaoSalvas = false;
    }

    function alternarModo(btn, modo) {
      document.querySelectorAll('.modo-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      state.modo = modo;
      
      document.getElementById('bloco-data').style.display = modo === 'diario' ? 'block' : 'none';
      document.getElementById('bloco-mes').style.display = modo === 'relatorio' ? 'block' : 'none';
      
      carregarCards();
    }

    function voltarParaPainel() {
      if (alteracoesNaoSalvas && !confirm("Existem alterações não salvas. Deseja voltar?")) return;
      alteracoesNaoSalvas = false;
      document.getElementById('tela-chamada').style.display = 'none';
      document.getElementById('tela-relatorio').style.display = 'none';
      document.getElementById('tela-painel').style.display = 'block';
      carregarCards();
    }

    // ==========================================================================
    // CARREGAMENTO DOS CARDS
    // ==========================================================================
    function carregarCards() {
      const grid = document.getElementById('grid-turmas');
      grid.innerHTML = '';
      
      if (!dbTurmas.length) return;
      
      const ehDiario = state.modo === 'diario';
      const dataStr = document.getElementById('input-data').value;
      const mesStr = document.getElementById('select-mes').value;
      
      let mesExtenso = ehDiario ? getMesNomeDaData(dataStr) : mesStr;
      
      // As 18 turmas (já filtradas no backend/state interno) são renderizadas diretamente
      dbTurmas.forEach(turma => {
        const div = document.createElement('div');
        div.className = 'card-turma';
        div.onclick = () => abrirTurma(turma.id, turma.nome);
        
        div.innerHTML = `
          <div class="tag-turma">${turma.turno}</div>
          <div class="titulo-turma">${turma.nome}</div>
          <div class="info-turma">${turma.unidade}</div>
          ${ehDiario ? `<div class="status-container-card"><span class="badge-loading-card" id="status-${turma.id}">Carregando...</span></div>` : ''}
        `;
        grid.appendChild(div);
      });

      if (ehDiario && dataStr) {
        google.script.run.withSuccessHandler(statusLista => {
          statusLista.forEach(st => {
            const el = document.getElementById('status-' + st.id);
            if (el) {
              if (st.status === 'Realizada') {
                el.className = 'badge-sucesso-card'; el.innerText = 'Realizada';
              } else if (st.status === 'Pendente') {
                el.className = 'badge-alerta-card'; el.innerText = 'Pendente';
              } else {
                el.className = 'badge-loading-card'; el.innerText = st.status;
              }
            }
          });
        }).getPainelMonitoramento(state.unidade, state.turno, dataStr, mesExtenso);
      }
    }

    function abrirTurma(id, nome) {
      state.turmaId = id;
      state.turmaNome = nome;
      mostrarLoading(true);
      
      if (state.modo === 'diario') {
        const dataStr = document.getElementById('input-data').value;
        const mes = getMesNomeDaData(dataStr);
        document.getElementById('info-chamada').innerText = `${nome} - ${formatarDataBR(dataStr)}`;
        
        google.script.run.withSuccessHandler(res => {
          dadosAlunosChamada = res.alunos;
          renderizarListaChamada();
          document.getElementById('tela-painel').style.display = 'none';
          document.getElementById('tela-chamada').style.display = 'block';
          mostrarLoading(false);
        }).withFailureHandler(err => {
          mostrarLoading(false); alert(err.message);
        }).getDadosChamada(id, mes, dataStr);
        
      } else {
        const mes = document.getElementById('select-mes').value;
        document.getElementById('info-relatorio').innerText = `${nome} - Relatório Geral ${mes}`;
        
        google.script.run.withSuccessHandler(res => {
          renderizarMatrizGeral(res);
          document.getElementById('tela-painel').style.display = 'none';
          document.getElementById('tela-relatorio').style.display = 'block';
          mostrarLoading(false);
        }).withFailureHandler(err => {
          mostrarLoading(false); alert(err.message);
        }).getRelatorioGeralMatriz(id, mes);
      }
    }

    // ==========================================================================
    // LÓGICA DA CHAMADA
    // ==========================================================================
    function renderizarListaChamada() {
      const lista = document.getElementById('lista-alunos');
      lista.innerHTML = '';
      
      dadosAlunosChamada.forEach((aluno, index) => {
        if (aluno.inativo) return;
        
        aluno.status = aluno.status || '•'; 
        const isFalta = aluno.status === 'F';
        
        const li = document.createElement('li');
        li.className = 'row-item';
        li.innerHTML = `
          <div class="simade">${aluno.simade}</div>
          <div class="student-name">${aluno.nome}</div>
          <div class="total-faltas">${aluno.faltas}</div>
          <button class="btn-attendance ${isFalta ? 'falta' : 'presente'}" onclick="alternarPresenca(${index})">
            ${isFalta ? 'F' : 'P'}
          </button>
        `;
        lista.appendChild(li);
      });
    }

    function alternarPresenca(index) {
      const aluno = dadosAlunosChamada[index];
      aluno.status = aluno.status === '•' ? 'F' : '•';
      alteracoesNaoSalvas = true;
      renderizarListaChamada();
    }

    function marcarTodos(status) {
      dadosAlunosChamada.forEach(a => { if (!a.inativo) a.status = status; });
      alteracoesNaoSalvas = true;
      renderizarListaChamada();
    }

    function salvarChamada() {
      const dataStr = document.getElementById('input-data').value;
      const mes = getMesNomeDaData(dataStr);
      
      mostrarLoading(true);
      google.script.run.withSuccessHandler(msg => {
        mostrarLoading(false);
        alteracoesNaoSalvas = false;
        alert(msg);
        voltarParaPainel();
      }).withFailureHandler(err => {
        mostrarLoading(false);
        alert(err.message);
      }).salvarRegistroChamada(state.turmaId, mes, dataStr, dadosAlunosChamada);
    }

    // ==========================================================================
    // LÓGICA DO RELATÓRIO GERAL
    // ==========================================================================
    function renderizarMatrizGeral(res) {
      const thead = document.getElementById('matriz-thead');
      const tbody = document.getElementById('matriz-tbody');
      
      let htmlHead = `<tr><th>SIMADE</th><th style="text-align:left; min-width:200px;">Estudante</th>`;
      res.datas.forEach(d => htmlHead += `<th>${d}</th>`);
      htmlHead += `<th>Faltas</th><th>Freq.</th></tr>`;
      thead.innerHTML = htmlHead;
      
      let htmlBody = '';
      res.alunos.forEach(aluno => {
        htmlBody += `<tr ${aluno.inativo ? 'style="text-decoration:line-through; opacity:0.6;"' : ''}>
          <td>${aluno.simade}</td>
          <td style="text-align:left; font-weight:600;">${aluno.nome}</td>`;
          
        aluno.historico.forEach(val => {
          let color = val === 'F' ? 'color: var(--danger-color); font-weight: bold;' : 'color: var(--success-color);';
          htmlBody += `<td style="${color}">${val || ''}</td>`;
        });
        
        htmlBody += `
          <td style="font-weight:bold;">${aluno.totalFaltas}</td>
          <td><span style="background:${aluno.freqPercent >= 75 ? 'var(--success-light)' : 'var(--danger-light)'}; color:${aluno.freqPercent >= 75 ? 'var(--success-color)' : 'var(--danger-color)'}; padding: 4px 8px; border-radius: 8px; font-weight: bold; font-size:11px;">${aluno.freqPercent}%</span></td>
        </tr>`;
      });
      tbody.innerHTML = htmlBody;
    }

    function exportarPDF() {
      const mes = document.getElementById('select-mes').value;
      mostrarLoading(true);
      google.script.run.withSuccessHandler(base64 => {
        mostrarLoading(false);
        const link = document.createElement('a');
        link.href = base64;
        link.download = `Relatorio_${state.turmaNome}_${mes}.pdf`;
        link.click();
      }).withFailureHandler(err => {
        mostrarLoading(false);
        alert(err.message);
      }).exportarRelatorioGeralPDF(state.turmaId, mes);
    }

    // ==========================================================================
    // UTILITÁRIOS
    // ==========================================================================
    function mostrarLoading(show) { document.getElementById('loading-overlay').style.display = show ? 'flex' : 'none'; }
    function getMesNomeDaData(dataStr) {
      if(!dataStr) return "";
      return MESES[new Date(dataStr + 'T12:00:00').getMonth()];
    }
    function formatarDataBR(dataStr) {
      if(!dataStr) return "";
      const d = new Date(dataStr + 'T12:00:00');
      return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
    }
  </script>
</body>
</html>
